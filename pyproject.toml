[project]
name = "vocabot"
version = "0.1.0"
description = "Bot de WhatsApp para praticar vocabulário de inglês, com export para Excel"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "google-genai>=1.0",
    "google-cloud-firestore>=2.19",
    "google-cloud-storage>=2.18",
    "google-auth>=2.35",
    # `python:3.12-slim` (Dockerfile) não traz o banco de fusos do sistema; sem isto,
    # ZoneInfo("America/Sao_Paulo") (M10, lembretes) estoura na imagem, mesmo passando local.
    "tzdata>=2025.2",
    "openpyxl>=3.1.5",
    "google-cloud-texttospeech>=2.37.0",
    "google-cloud-logging>=3.16.3",
    "jinja2>=3.1.6",
    "weasyprint>=70.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.16.8",  # alinhado com o rev do pre-commit: versões diferentes discordam sobre S603
    "mypy>=1.13",
    "pre-commit>=4.0",
    "types-pyyaml>=6.0",
    "pyyaml>=6.0.3",
    "types-openpyxl>=3.1.5.20260827",
    "pypdf>=6.21.2",
]
# Extras usados só pelos evals contra a API real (fora do pytest).
evals = [
    "pyyaml>=6.0",
    "anthropic>=0.40",
]

[tool.uv]
# Aplicação, não biblioteca: não há wheel para construir.
package = false

# ---------------------------------------------------------------------------
# Ruff: lint + formatação
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["referencia", "spec", "docs"]  # a spec é contrato, não código a formatar

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort (ordem de imports)
    "UP",        # pyupgrade (idiomas modernos)
    "B",         # flake8-bugbear (armadilhas comuns)
    "C4",        # comprehensions
    "SIM",       # simplificações
    "ARG",       # argumentos não usados
    "PTH",       # prefira pathlib a os.path
    "RUF",       # regras do próprio ruff
    "S",         # flake8-bandit (segurança)
    "T20",       # sem print() em código de produção
    "ASYNC",     # armadilhas de async
    "LOG", "G",  # uso correto de logging
]
ignore = [
    "E501",      # comprimento de linha é responsabilidade do formatter
    "B008",      # Depends(...) em default de argumento é idiomático no FastAPI
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "ARG001", "ARG002"]  # assert e fixtures não usadas são normais em teste
"sim/**" = ["T20"]                          # o simulador de terminal imprime de propósito
"sim/tutor.py" = ["ARG002"]                 # implementa o Protocol Tutor: nem todo argumento é usado
"app/services/fake_llm.py" = ["ARG002"]     # idem: FakeTutor implementa o Protocol Tutor
"evals/**" = ["T20", "S101"]
"scripts/**" = ["T20"]                       # scripts de linha de comando imprimem de propósito

[tool.ruff.lint.isort]
known-first-party = ["app", "sim", "evals"]

[tool.ruff.format]
docstring-code-format = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
asyncio_mode = "auto"
# Projeto é aplicação, não pacote instalável (tool.uv.package = false acima):
# sem isso, `app/` não entra no sys.path quando `uv run pytest` roda o script direto.
pythonpath = ["."]
markers = [
    "slow: testes lentos, pulados por padrão em loop rápido de TDD",
]

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
files = ["."]
exclude = ['^\.venv/', '^referencia/', '^build/', '^dist/']
strict = true
warn_unreachable = true
pretty = true
plugins = ["pydantic.mypy"]
# Bibliotecas sem stubs completos:
[[tool.mypy.overrides]]
module = ["google.*", "waha.*", "anthropic.*", "weasyprint.*"]
ignore_missing_imports = true

# google-cloud-logging: o `Client.__init__` não é tipado (M27, ADR-0028) — isolado neste módulo.
[[tool.mypy.overrides]]
module = ["app.services.log_handler"]
disallow_untyped_calls = false

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

# ---------------------------------------------------------------------------
# coverage
# ---------------------------------------------------------------------------
[tool.coverage.run]
branch = true
source = ["app"]
omit = ["*/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
