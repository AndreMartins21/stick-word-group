name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, formatação, tipagem e segredos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0  # gitleaks precisa do histórico

      - name: Instalar uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true

      - name: Sincronizar dependências
        run: uv sync --group dev

      - name: pre-commit (ruff, gitleaks, shellcheck, mypy)
        run: uv run pre-commit run --all-files --show-diff-on-failure

  test:
    name: Testes (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Instalar uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true

      - name: Sincronizar dependências
        run: uv sync --group dev

      - name: pytest
        run: uv run pytest --cov --cov-report=term-missing

  compose:
    name: Validar docker compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # O compose só existe a partir do M7; até lá o job passa sem fazer nada.
      - name: docker compose config
        run: |
          if [ -f docker-compose.yml ]; then
            docker compose --env-file .env.example config --quiet
          else
            echo "Sem docker-compose.yml ainda (chega no M7) - nada a validar."
          fi

  deploy:
    name: Deploy em produção
    needs: [checks, test, compose]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Workload Identity Federation (ADR-0013): sem chave de conta de serviço em arquivo. O
      # provider só troca o token por credencial se assertion.repository + assertion.ref baterem
      # (ver infra/setup_cicd.sh) — um fork ou outra branch nunca conseguem autenticar.
      - name: Autenticar na GCP
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: vocabot-deploy@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com

      - name: Instalar gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Deploy (empacota, copia via IAP, sobe o compose na VM)
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GEMINI_MODEL_EVAL: ${{ vars.GEMINI_MODEL_EVAL }}
          USER_LEVEL: ${{ vars.USER_LEVEL }}
          TIMEZONE: ${{ vars.TIMEZONE }}
          MAX_GROUPS: ${{ vars.MAX_GROUPS }}
          CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
          GROUP_PREFIX: ${{ vars.GROUP_PREFIX }}
          LIMITE_POR_SESSAO_GRUPO: ${{ vars.LIMITE_POR_SESSAO_GRUPO }}
          TIMEOUT_MARCACAO_HORAS: ${{ vars.TIMEOUT_MARCACAO_HORAS }}
          MAX_CARACTERES: ${{ vars.MAX_CARACTERES }}
          MAX_SEGUNDOS_AUDIO: ${{ vars.MAX_SEGUNDOS_AUDIO }}
          LIMITE_PESSOA_MINUTO: ${{ vars.LIMITE_PESSOA_MINUTO }}
          LIMITE_PESSOA_DIA: ${{ vars.LIMITE_PESSOA_DIA }}
          LIMITE_GRUPO_DIA: ${{ vars.LIMITE_GRUPO_DIA }}
          LIMITE_AUDIO_SEGUNDOS_DIA: ${{ vars.LIMITE_AUDIO_SEGUNDOS_DIA }}
          ORCAMENTO_DIARIO_USD: ${{ vars.ORCAMENTO_DIARIO_USD }}
          ORCAMENTO_MENSAL_USD: ${{ vars.ORCAMENTO_MENSAL_USD }}
          COTA_DIARIA_POR_GRUPO_USD: ${{ vars.COTA_DIARIA_POR_GRUPO_USD }}
          MAX_FILA_POR_CHAT: ${{ vars.MAX_FILA_POR_CHAT }}
          MAX_PROCESSAMENTOS: ${{ vars.MAX_PROCESSAMENTOS }}
          GEMINI_THINKING_LEVEL: ${{ vars.GEMINI_THINKING_LEVEL }}
          ALLOWED_NUMBER: ${{ secrets.ALLOWED_NUMBER }}
          ALLOWED_NUMBERS: ${{ secrets.ALLOWED_NUMBERS }}
          ALLOWED_GROUPS: ${{ secrets.ALLOWED_GROUPS }}
          OWNER_NUMBER: ${{ secrets.OWNER_NUMBER }}
          BOT_NUMBER: ${{ secrets.BOT_NUMBER }}
        run: bash infra/deploy.sh

      - name: Smoke test (falha o workflow se o bot não subir)
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        run: bash infra/smoke_test.sh
